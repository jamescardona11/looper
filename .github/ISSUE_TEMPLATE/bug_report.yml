name: Bug report
description: Something is broken or behaves unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please fill in enough detail to reproduce it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - Backend (Convex)
        - Web (apps/web)
        - Mobile (apps/mobile)
        - Desktop (apps/desktop)
        - Build / tooling
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Node version (`node -v`), package manager, device/simulator if mobile.
      placeholder: macOS 15.4, Node 22.18, pnpm 10, iOS Simulator 18.2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and attachments
      description: Paste relevant output or attach screenshots. Redact secrets and private user data first.
