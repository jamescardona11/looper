name: Feature request
description: Suggest a Looper capability or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Looper makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Reference an existing product or pattern if relevant.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which part of the stack?
      multiple: true
      options:
        - Backend (Convex)
        - Web (apps/web)
        - Mobile (apps/mobile)
        - Desktop (apps/desktop)
        - Packages / config
        - Docs / DX
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Other approaches you weighed and why you discarded them.
