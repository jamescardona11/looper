<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Self-hosted, so they are same-origin and preloadable. Vite rewrites both
         hrefs to the hashed files in /assets at build time. The design links
         Bricolage, Inter and JetBrains Mono from Google Fonts; Inter is not
         installed anywhere in this repo, so --font-sans falls through to SF Pro
         and the system stack exactly as apps/web does. A render-blocking request
         to a third party would defeat the point of prerendering this page. -->
    <link
      rel="preload"
      href="../../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-opsz-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>Looper: your voice becomes work</title>
    <meta
      name="description"
      content="Dictate anywhere, capture meetings, and keep original audio beside the finished note. Looper runs locally by default on macOS, Windows and Linux."
    />
    <meta name="application-name" content="Looper" />
    <meta name="apple-mobile-web-app-title" content="Looper" />
    <link rel="canonical" href="https://looper.app/" />
    <meta name="theme-color" content="#fbfaf5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15161a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Looper" />
    <meta property="og:locale" content="en" />
    <meta property="og:url" content="https://looper.app/" />
    <meta property="og:title" content="Looper: your voice becomes work" />
    <meta
      property="og:description"
      content="Dictate anywhere, capture meetings, and keep original audio beside the finished note. Local by default."
    />
    <meta property="og:image" content="https://looper.app/looper-workspace-purple-en.png" />
    <meta property="og:image:width" content="1350" />
    <meta property="og:image:height" content="830" />
    <meta
      property="og:image:alt"
      content="Looper desktop workspace with dictation history, local model status and meeting notes"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Looper: your voice becomes work" />
    <meta
      name="twitter:description"
      content="Dictate anywhere, capture meetings, and keep original audio beside the finished note. Local by default."
    />
    <meta name="twitter:image" content="https://looper.app/looper-workspace-purple-en.png" />
    <meta
      name="twitter:image:alt"
      content="Looper desktop workspace with dictation history, local model status and meeting notes"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>You need to enable JavaScript to run Looper.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
