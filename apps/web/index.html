<!doctype html>
<html lang="en" class="light">
  <head>
    <link
      rel="preload"
      href="../../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Web is intentionally light-only. Apply it before first paint so a
         previously saved preference cannot flash an obsolete dark surface. -->
    <script>
      (function () {
        try {
          var el = document.documentElement;
          localStorage.setItem("looper-theme", "light");
          el.classList.remove("dark");
          el.classList.add("light");
          if (
            window.__TAURI_INTERNALS__ &&
            window.__TAURI_INTERNALS__.metadata &&
            window.__TAURI_INTERNALS__.metadata.currentWindow &&
            window.__TAURI_INTERNALS__.metadata.currentWindow.label ===
              "quick-pane"
          ) {
            el.classList.add("is-quick-pane");
          }
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Looper turns voice into useful text for dictation, recordings, and meetings."
    />
    <meta name="theme-color" content="#efede7" />

    <!-- OpenGraph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Looper: voice to useful text" />
    <meta
      property="og:description"
      content="Dictate, transcribe, review, and reuse recordings and meetings with Looper."
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Looper: voice to useful text" />
    <meta
      name="twitter:description"
      content="Dictate, transcribe, review, and reuse recordings and meetings with Looper."
    />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Looper</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      .boot-loader {
        display: grid;
        min-height: 100vh;
        place-items: center;
        background: #fbfaf5;
        color: #15161a;
        font-family: ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .boot-loader__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        text-align: center;
      }

      .boot-loader__brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
      }

      .boot-loader__logo {
        display: grid;
        width: 2.75rem;
        height: 2.75rem;
        place-items: center;
        box-sizing: border-box;
        border: 1px solid #d9d0ff;
        border-radius: 0.875rem;
        background: #efedff;
        color: #6754e8;
      }

      .boot-loader__title {
        margin: 0;
        font-size: 1rem;
        font-weight: 700;
      }

      .boot-loader__hint {
        margin: 0;
        color: #626671;
        font-size: 0.8125rem;
      }

      .boot-loader__spinner {
        width: 1.125rem;
        height: 1.125rem;
        margin-top: 0.25rem;
        box-sizing: border-box;
        border: 2px solid rgba(103, 84, 232, 0.2);
        border-top-color: #6754e8;
        border-radius: 999px;
        animation: boot-spin 0.8s linear infinite;
      }

      html.is-quick-pane .boot-loader {
        display: none;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-loader__spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        class="boot-loader"
        data-boot-loader
        role="status"
        aria-label="Loading Looper"
      >
        <div class="boot-loader__content" aria-hidden="true">
          <div class="boot-loader__brand">
            <span class="boot-loader__logo">
              <svg width="24" height="24" viewBox="0 0 80 80" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M10 27c0-9.389 7.611-17 17-17h19v22h22v21c0 9.389-7.611 17-17 17H27c-9.389 0-17-7.611-17-17V27Z"
                ></path>
                <rect width="20" height="20" x="52" y="4" rx="3" fill="currentColor"></rect>
              </svg>
            </span>
            <div>
              <p class="boot-loader__title">Preparing your workspace</p>
              <p class="boot-loader__hint">
                Loading your tools and preferences.
              </p>
            </div>
          </div>
          <span class="boot-loader__spinner"></span>
        </div>
      </div>
    </div>
    <noscript>You need to enable JavaScript to run Looper.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
