[package]
name = "looper-aec"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

[features]
default = ["onnx", "128"]
onnx = ["dep:looper-onnx"]
128 = []
256 = []
512 = []

[dependencies]
looper-onnx = { path = "../onnx", optional = true }
realfft = "3.5.0"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
