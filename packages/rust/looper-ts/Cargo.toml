[package]
name = "looper-ts"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "AGPL-3.0-or-later"
description = "Internal local transcription engines for Looper"

[features]
default = []
directml = ["ort/directml"]

[dependencies]
futures-util = "0.3"
ndarray = "0.17"
ort = { version = "=2.0.0-rc.12", features = ["api-24", "ndarray"] }
realfft = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
rubato = "3.0.0"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
webrtc-vad = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
hound = "3.5"
serde_json = "1"
tempfile = "3"
